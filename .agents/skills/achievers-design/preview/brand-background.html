<!doctype html>
<html><head><meta charset="utf-8"><title>Brand — Background</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; height: 200px; display: grid; grid-template-columns: 1fr 1fr; }
  .panel { padding: 18px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--border-2); }
  .panel:last-child { border-right: none; }
  .grid-a { background-color: #000; background-image: radial-gradient(circle, #1a1a1a 1px, transparent 1px); background-size: 24px 24px; }
  .grid-b { background-color: #000; background-image: radial-gradient(circle, #141414 1px, transparent 1px); background-size: 16px 16px; }
  .label { color: var(--fg-3); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; }
  .name { color: var(--fg-1); font-size: 14px; font-weight: 600; }
  .desc { color: var(--fg-2); font-size: 11px; line-height: 1.5; }
</style>
</head><body>
<div class="card">
  <div class="panel grid-a">
    <span class="label">.bg-grid</span>
    <div>
      <div class="name">Dotted grid · 24px</div>
      <div class="desc">Default. Hero areas, login, slides.</div>
    </div>
  </div>
  <div class="panel grid-b">
    <span class="label">.bg-grid-fine</span>
    <div>
      <div class="name">Dotted grid · 16px</div>
      <div class="desc">Tighter — empty states, cards.</div>
    </div>
  </div>
</div>
</body></html>
