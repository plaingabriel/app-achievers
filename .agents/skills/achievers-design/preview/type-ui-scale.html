<!doctype html>
<html><head><meta charset="utf-8"><title>Type — UI Scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px 28px; }
  .row { display: grid; grid-template-columns: 90px 1fr; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--border-1); }
  .row:last-child { border-bottom: none; }
  .meta { color: var(--fg-3); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  .specimen { color: var(--fg-1); line-height: 1.2; }
</style>
</head><body>
<div class="card">
  <div class="row"><span class="meta">24 / 700</span><span class="specimen" style="font-size:24px; font-weight:700;">Heading two</span></div>
  <div class="row"><span class="meta">20 / 600</span><span class="specimen" style="font-size:20px; font-weight:600;">Heading three</span></div>
  <div class="row"><span class="meta">16 / 500</span><span class="specimen" style="font-size:16px; font-weight:500;">Heading four / large body</span></div>
  <div class="row"><span class="meta">14 / 400</span><span class="specimen" style="font-size:14px;">Body — default reading size</span></div>
  <div class="row"><span class="meta">13 / 400</span><span class="specimen" style="font-size:13px;">Body — UI default (workhorse)</span></div>
  <div class="row"><span class="meta">12 / 400</span><span class="specimen" style="font-size:12px; color:var(--fg-2);">Body small — meta, captions</span></div>
  <div class="row"><span class="meta">11 / 500</span><span class="specimen" style="font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--fg-2);">LABEL — uppercase, tracked</span></div>
</div>
</body></html>
