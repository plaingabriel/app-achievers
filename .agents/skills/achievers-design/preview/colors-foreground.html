<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Foreground & Borders</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 24px; }
  .label { color: var(--fg-3); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
  .row:last-child { margin-bottom: 0; }
  .fg-tile {
    background: var(--bg-1);
    border: 1px solid var(--border-2);
    padding: 14px 10px;
    text-align: left;
  }
  .fg-tile .specimen { font-size: 18px; font-weight: 600; line-height: 1; }
  .fg-tile .name { font-size: 10px; color: var(--fg-3); margin-top: 8px; letter-spacing: 0.04em; }
  .border-tile {
    background: var(--bg-0);
    padding: 14px 10px;
    text-align: left;
    height: 56px;
    box-sizing: border-box;
  }
  .border-tile .name { font-size: 10px; color: var(--fg-3); letter-spacing: 0.04em; }
  .border-tile .hex { font-size: 10px; color: var(--fg-2); margin-top: 4px; }
</style>
</head><body>
<div class="card">
  <div class="label">Foreground — fg-1 → fg-5</div>
  <div class="row">
    <div class="fg-tile"><div class="specimen" style="color:#f5f5f5;">Aa</div><div class="name">fg-1 / #f5f5f5</div></div>
    <div class="fg-tile"><div class="specimen" style="color:#a3a3a3;">Aa</div><div class="name">fg-2 / #a3a3a3</div></div>
    <div class="fg-tile"><div class="specimen" style="color:#6b6b6b;">Aa</div><div class="name">fg-3 / #6b6b6b</div></div>
    <div class="fg-tile"><div class="specimen" style="color:#404040;">Aa</div><div class="name">fg-4 / #404040</div></div>
    <div class="fg-tile"><div class="specimen" style="color:#262626;">Aa</div><div class="name">fg-5 / #262626</div></div>
  </div>
  <div class="label">Borders — border-1 → border-4</div>
  <div class="row">
    <div class="border-tile" style="border:1px solid #1f1f1f;"><div class="name">border-1</div><div class="hex">#1f1f1f</div></div>
    <div class="border-tile" style="border:1px solid #2a2a2a;"><div class="name">border-2</div><div class="hex">#2a2a2a</div></div>
    <div class="border-tile" style="border:1px solid #404040;"><div class="name">border-3</div><div class="hex">#404040</div></div>
    <div class="border-tile" style="border:1px solid #595959;"><div class="name">border-4</div><div class="hex">#595959</div></div>
    <div class="border-tile" style="border:1px solid var(--accent);"><div class="name" style="color:var(--accent);">focus</div><div class="hex">#f59e0b</div></div>
  </div>
</div>
</body></html>
