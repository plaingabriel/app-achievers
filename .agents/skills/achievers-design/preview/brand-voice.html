<!doctype html>
<html><head><meta charset="utf-8"><title>Brand — Voice</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; }
  .label { color: var(--fg-3); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 14px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .pair:last-child { margin-bottom: 0; }
  .ex { padding: 12px 14px; border: 1px solid var(--border-2); font-size: 12px; line-height: 1.5; }
  .yes { background: #07170c; border-color: #15391f; color: var(--fg-1); }
  .yes::before { content: "✓ "; color: #22c55e; }
  .no { background: #1a0808; border-color: #3f1414; color: var(--fg-2); text-decoration: line-through; text-decoration-color: #ef4444; }
  .no::before { content: "✕ "; color: #ef4444; text-decoration: none; }
</style>
</head><body>
<div class="card">
  <div class="label">Voice — write like an engineer</div>
  <div class="pair">
    <div class="ex yes">No queries yet. Run one above.</div>
    <div class="ex no">Welcome! Get started by running your first query 🚀</div>
  </div>
  <div class="pair">
    <div class="ex yes">Token expired. Sign in again.</div>
    <div class="ex no">Oops! Something went wrong, please try again.</div>
  </div>
  <div class="pair">
    <div class="ex yes">Saved.</div>
    <div class="ex no">Successfully saved your changes!</div>
  </div>
</div>
</body></html>
