name: CI

# Lint / typecheck / build. Runs on PRs and on non-main pushes; also callable
# as a reusable workflow so deploy.yml can gate the droplet deploy on it
# (phase-12-github-actions). No test job yet — Tests are the final build phase.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Biome CI (lint + format check)
        run: pnpm exec biome ci .

      # Build first: the tanstackStart() vite plugin generates the gitignored
      # src/routeTree.gen.ts, which typecheck needs for route types to resolve.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck
