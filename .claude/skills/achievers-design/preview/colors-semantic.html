<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Semantic</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 24px; }
  .label { color: var(--fg-3); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tile {
    background: var(--bg-1);
    border: 1px solid var(--border-2);
    padding: 14px;
  }
  .pill {
    display: inline-block;
    padding: 3px 8px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
    border: 1px solid;
  }
  .name { font-size: 11px; color: var(--fg-1); margin-top: 12px; font-weight: 500; }
  .hex { font-size: 10px; color: var(--fg-3); margin-top: 2px; }
</style>
</head><body>
<div class="card">
  <div class="label">Semantic — status</div>
  <div class="row">
    <div class="tile">
      <span class="pill" style="color:#22c55e; background:#07170c; border-color:#15391f;">Active</span>
      <div class="name">success</div><div class="hex">#22c55e</div>
    </div>
    <div class="tile">
      <span class="pill" style="color:#f59e0b; background:#1a1206; border-color:#42310a;">Pending</span>
      <div class="name">warning</div><div class="hex">#f59e0b</div>
    </div>
    <div class="tile">
      <span class="pill" style="color:#ef4444; background:#1a0808; border-color:#3f1414;">Failed</span>
      <div class="name">danger</div><div class="hex">#ef4444</div>
    </div>
    <div class="tile">
      <span class="pill" style="color:#3b82f6; background:#07111f; border-color:#15294f;">Info</span>
      <div class="name">info</div><div class="hex">#3b82f6</div>
    </div>
  </div>
</div>
</body></html>
