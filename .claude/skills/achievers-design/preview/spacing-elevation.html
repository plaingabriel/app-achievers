<!doctype html>
<html><head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px; display: flex; gap: 16px; }
  .label { color: var(--fg-3); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  .tile {
    flex: 1;
    height: 130px;
    background: var(--bg-1);
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: var(--fg-2);
    font-size: 11px;
  }
  .e1 { border: 1px solid var(--border-2); }
  .e2 { border: 1px solid var(--border-2); box-shadow: 0 8px 24px -8px rgba(0,0,0,0.6); }
  .e3 { border: 1px solid var(--border-3); box-shadow: 0 24px 64px -12px rgba(0,0,0,0.9); }
  .ef { border: 1px solid var(--accent); box-shadow: 0 0 0 1px var(--bg-0), 0 0 0 3px var(--accent); }
  .name { font-size: 11px; color: var(--fg-1); font-weight: 500; }
  .desc { color: var(--fg-3); font-size: 10px; }
</style>
</head><body>
<div class="card">
  <div class="tile e1">
    <div class="name">shadow-1</div>
    <div class="desc">card · default<br>just a 1px border</div>
  </div>
  <div class="tile e2">
    <div class="name">shadow-2</div>
    <div class="desc">popover · menu<br>border + soft drop</div>
  </div>
  <div class="tile e3">
    <div class="name">shadow-3</div>
    <div class="desc">modal · command<br>strong drop</div>
  </div>
  <div class="tile ef">
    <div class="name" style="color:var(--accent);">focus</div>
    <div class="desc">3px amber ring<br>over a 1px black inset</div>
  </div>
</div>
</body></html>
