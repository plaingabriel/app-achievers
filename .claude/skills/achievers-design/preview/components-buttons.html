<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; }
  .label { color: var(--fg-3); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .row:last-child { margin-bottom: 0; }
  .btn {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    padding: 0 14px;
    height: 32px;
    border: 1px solid var(--border-2);
    background: transparent;
    color: var(--fg-1);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-sizing: border-box;
  }
  .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); }
  .btn-secondary { background: transparent; }
  .btn-ghost { border-color: transparent; color: var(--fg-2); }
  .btn-danger { color: #ef4444; border-color: transparent; }
  .btn-danger:hover { background: #1a0808; border-color: #3f1414; }
  .btn-sm { height: 26px; padding: 0 10px; font-size: 12px; }
  .btn-lg { height: 40px; padding: 0 18px; font-size: 14px; }
  .focus { box-shadow: 0 0 0 1px #000, 0 0 0 3px var(--accent); }
  .arrow { color: inherit; font-weight: 400; }
</style>
</head><body>
<div class="card">
  <div class="label">Buttons — variants</div>
  <div class="row">
    <button class="btn btn-primary">Run query <span class="arrow">→</span></button>
    <button class="btn btn-secondary">Cancel</button>
    <button class="btn btn-ghost">Skip</button>
    <button class="btn btn-danger">Delete</button>
    <button class="btn btn-secondary focus">Focused</button>
  </div>
  <div class="label" style="margin-top:6px;">Sizes</div>
  <div class="row">
    <button class="btn btn-primary btn-sm">Save</button>
    <button class="btn btn-primary">Save changes</button>
    <button class="btn btn-primary btn-lg">Continue</button>
  </div>
</div>
</body></html>
