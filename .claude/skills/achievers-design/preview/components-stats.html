<!doctype html>
<html><head><meta charset="utf-8"><title>Card & Stat</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat {
    background: var(--bg-1);
    border: 1px solid var(--border-2);
    padding: 16px;
  }
  .label { color: var(--fg-3); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; }
  .value { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; color: var(--fg-1); margin-top: 6px; line-height: 1; font-variant-numeric: tabular-nums; }
  .delta { font-size: 11px; margin-top: 8px; color: var(--fg-2); }
  .up { color: #22c55e; }
  .down { color: #ef4444; }
</style>
</head><body>
<div class="card">
  <div class="stat">
    <div class="label">Active members</div>
    <div class="value">1,247</div>
    <div class="delta"><span class="up">↑ 4.2%</span> · vs last week</div>
  </div>
  <div class="stat">
    <div class="label">Achievements unlocked</div>
    <div class="value">38,492</div>
    <div class="delta"><span class="up">↑ 12.1%</span> · vs last week</div>
  </div>
  <div class="stat">
    <div class="label">Median session</div>
    <div class="value">04:21</div>
    <div class="delta"><span class="down">↓ 0.3%</span> · vs last week</div>
  </div>
  <div class="stat">
    <div class="label">Error rate</div>
    <div class="value" style="color:var(--accent);">0.04%</div>
    <div class="delta">within target · 99.96%</div>
  </div>
</div>
</body></html>
