<!doctype html>
<html><head><meta charset="utf-8"><title>Table</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; }
  .wrap {
    background: var(--bg-0);
    border: 1px solid var(--border-2);
    margin: 16px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border-1); }
  th {
    font-weight: 500;
    color: var(--fg-3);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--bg-1);
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg-1); }
  .id { color: var(--fg-3); font-size: 11px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; border: 1px solid; }
  .dot { width: 5px; height: 5px; border-radius: 50%; }
  .num { font-variant-numeric: tabular-nums; color: var(--fg-2); }
</style>
</head><body>
<div class="card">
  <div class="wrap">
    <table>
      <thead><tr><th>Member</th><th>Role</th><th>Status</th><th>Achievements</th></tr></thead>
      <tbody>
        <tr><td>taylor.chen <span class="id">· #1042</span></td><td>Admin</td><td><span class="pill" style="color:#22c55e; background:#07170c; border-color:#15391f;"><span class="dot" style="background:#22c55e;"></span>Active</span></td><td class="num">147</td></tr>
        <tr><td>r.okonkwo <span class="id">· #1043</span></td><td>Editor</td><td><span class="pill" style="color:#22c55e; background:#07170c; border-color:#15391f;"><span class="dot" style="background:#22c55e;"></span>Active</span></td><td class="num">88</td></tr>
        <tr><td>m.gable <span class="id">· #1044</span></td><td>Viewer</td><td><span class="pill" style="color:#f59e0b; background:#1a1206; border-color:#42310a;"><span class="dot" style="background:#f59e0b;"></span>Pending</span></td><td class="num">12</td></tr>
        <tr><td>sam.k <span class="id">· #1045</span></td><td>Admin</td><td><span class="pill" style="color:var(--fg-2); background:var(--bg-1); border-color:var(--border-2);"><span class="dot" style="background:var(--fg-3);"></span>Idle</span></td><td class="num">204</td></tr>
      </tbody>
    </table>
  </div>
</div>
</body></html>
