<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Display</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px 28px 32px; }
  .stack > * + * { margin-top: 14px; }
  .meta { color: var(--fg-3); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  .display-row { display: flex; align-items: baseline; gap: 16px; }
  .display-row .meta { min-width: 80px; }
  .specimen { color: var(--fg-1); line-height: 1; letter-spacing: -0.02em; }
</style>
</head><body>
<div class="card">
  <div class="stack">
    <div class="display-row">
      <span class="meta">88 / 700</span>
      <span class="specimen" style="font-size:64px; font-weight:700;">Aa01</span>
    </div>
    <div class="display-row">
      <span class="meta">44 / 700</span>
      <span class="specimen" style="font-size:44px; font-weight:700;">Display heading</span>
    </div>
    <div class="display-row">
      <span class="meta">32 / 700</span>
      <span class="specimen" style="font-size:32px; font-weight:700;">Heading one</span>
    </div>
  </div>
</div>
</body></html>
