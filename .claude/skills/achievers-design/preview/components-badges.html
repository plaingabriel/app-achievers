<!doctype html>
<html><head><meta charset="utf-8"><title>Badges & Status</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; }
  .label { color: var(--fg-3); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 8px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
    border: 1px solid;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .bracket { color: var(--fg-3); font-size: 12px; font-weight: 500; }
  .b-text { color: var(--fg-1); font-size: 12px; font-weight: 500; }
</style>
</head><body>
<div class="card">
  <div class="label">Status pills</div>
  <div class="row">
    <span class="pill" style="color:#22c55e; background:#07170c; border-color:#15391f;"><span class="dot" style="background:#22c55e;"></span>Active</span>
    <span class="pill" style="color:#f59e0b; background:#1a1206; border-color:#42310a;"><span class="dot" style="background:#f59e0b;"></span>Pending</span>
    <span class="pill" style="color:#ef4444; background:#1a0808; border-color:#3f1414;"><span class="dot" style="background:#ef4444;"></span>Failed</span>
    <span class="pill" style="color:#3b82f6; background:#07111f; border-color:#15294f;"><span class="dot" style="background:#3b82f6;"></span>Syncing</span>
    <span class="pill" style="color:var(--fg-2); background:var(--bg-1); border-color:var(--border-2);"><span class="dot" style="background:var(--fg-3);"></span>Idle</span>
  </div>
  <div class="label" style="margin-top:6px;">Bracketed labels — signature motif</div>
  <div class="row">
    <span><span class="bracket">[</span><span class="b-text">NEW</span><span class="bracket">]</span></span>
    <span><span class="bracket">[</span><span class="b-text" style="color:var(--accent);">BETA</span><span class="bracket">]</span></span>
    <span><span class="bracket">[</span><span class="b-text">v2.4.1</span><span class="bracket">]</span></span>
    <span><span class="bracket">[</span><span class="b-text">01 / OVERVIEW</span><span class="bracket">]</span></span>
    <span><span class="bracket">[</span><span class="b-text" style="color:#22c55e;">OK</span><span class="bracket">]</span></span>
  </div>
</div>
</body></html>
