pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{js,ts,jsx,tsx,json}'
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    block-dangerous-sql:
      glob: '*.sql'
      # Reject DROP / TRUNCATE / unscoped DELETE in committed SQL (see ADR 0011)
      run: |
        if grep -RniE '(\bDROP\b|\bTRUNCATE\b|DELETE[[:space:]]+FROM[^;]*;)' {staged_files} | grep -viE 'DELETE[[:space:]]+FROM[^;]*WHERE'; then
          echo 'Blocked: dangerous SQL (DROP / TRUNCATE / unscoped DELETE). See ADR 0011.'
          exit 1
        fi

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
